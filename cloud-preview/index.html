}
button, input, select { font: inherit; color: inherit; border: 0; background: none; outline: none; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side {

}
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; }

.nav-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); padding: 6px 12px; }
.nav-btn {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-sm);

  transition: background .25s var(--ease), color .25s var(--ease);
}
.nav-btn:hover { background: var(--surface-2); color: var(--text); }
.nav-btn.active { background: var(--accent-soft); color: var(--text); }

.side-foot { margin-top: auto; display: grid; gap: 10px; }
.side-card { padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.side-card .cap { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.seg button { padding: 6px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 600; color: var(--text-3); transition: all .2s var(--ease); white-space: nowrap; }

.main { padding: 28px 36px 60px; width: 100%; max-width: 1320px; margin: 0 auto; min-width: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;

}
.btn:active { transform: scale(.97); }

/* ---------- cards ---------- */

.list { display: grid; gap: 10px; }
